serenity {
  # Título del proyecto en el reporte HTML
  project.name = "Pruebas SOAP - Mi Empresa"

  # Dónde se guardan los resultados intermedios de Serenity
  outputDirectory = "target/site/serenity"

  # Nivel de logging: QUIET, NORMAL, VERBOSE
  logging = "NORMAL"
}

# URL base del servicio SOAP
# Puedes tener varios ambientes y cambiarlos con variables de entorno
environments {
  default {
    soap.base.url = "http://www.dneonline.com/calculator.asmx"
  }
  dev {
    soap.base.url = "http://dev.miempresa.com/ws/servicio"
  }
  qa {
    soap.base.url = "http://qa.miempresa.com/ws/servicio"
  }
}